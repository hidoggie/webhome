<!DOCTYPE html>
<html lang="ko">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>단종의 별</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="./../xr_st/coaching-overlay.js"></script>
  <script src="./../xr_st/aframe-extras-6.1.1.min.js"></script>
  <!-- 폭죽 효과를 위한 라이브러리 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- 모듈 스크립트 연결 -->
  <script type="module" src="./danjong.js" defer></script>

  <link rel="stylesheet" href="./danjong.css">

</head>

<body>

  <div
    style="position: absolute; top: 20px; left: 0; width: 100%; padding: 0 20px; box-sizing: border-box; z-index: 999; color: white; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); display: flex; justify-content: space-between;">
    <div id="score-board">점수: <span id="current-score">0</span> / 100</div>
    <div id="timer-board">남은 시간: <span id="time-left">30</span>초</div>
  </div>

  <!-- (신규) 게임 시작 안내 팝업 UI -->
  <div id="start-popup"
    style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 280px;">
    <h2 style="margin: 0 0 15px 0; color: #333;">🌟 별 잡기 미션 🌟</h2>
    <p style="margin: 0 0 20px 0; color: #666; font-size: 16px; line-height: 1.5;">
      화면을 드래그해 조이스틱으로<br>캐릭터를 움직이세요!<br>
      <strong style="color: #c86dd7;">30초 안에 별 10개를 모으세요!</strong>
    </p>
    <button id="start-btn"
      style="padding: 12px 24px; font-size: 18px; border-radius: 8px; background: linear-gradient(90deg,#7611b7,#c86dd7); color: white; border: none; cursor: pointer; font-weight: bold; width: 80%;">게임
      시작</button>
  </div>

  <!-- 최종 목표 달성 팝업 UI (초기에는 숨김 처리) -->
  <div id="success-popup"
    style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
    <h2 style="margin: 0 0 10px 0; color: #333; font-size: 1.3rem;">🎉 축하합니다! 🎉</h2>
    <p style="margin: 0 0 20px 0; color: #666; font-size: 18px;">목표 점수 달성!</p>
    <button onclick="window.location.reload()"
      style="padding: 12px 24px; font-size: 16px; border-radius: 8px; background: linear-gradient(90deg,#7611b7,#c86dd7); color: white; border: none; cursor: pointer; font-weight: bold;">다시
      하기</button>
  </div>

  <!-- (신규) 시간 초과 실패 팝업 UI -->
  <div id="fail-popup"
    style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
    <h2 style="margin: 0 0 10px 0; color: #333; font-size: 1.3rem;">시간 초과 ⏰</h2>
    <p style="margin: 0 0 20px 0; color: #666; font-size: 18px;">아쉽지만 목표 점수를 달성하지 못했습니다.</p>
    <button onclick="window.location.reload()"
      style="padding: 12px 24px; font-size: 16px; border-radius: 8px; background: #666; color: white; border: none; cursor: pointer; font-weight: bold;">다시
      도전하기</button>
  </div>

  <div id="overlay" style="z-index: 2">
    <img id="recenterBtn" src="./assets/reset.svg">
    <h3>DRAG TO MOVE</h3>
  </div>

  <a-scene coaching-overlay xrextras-gesture-detector xrextras-loading game-manager renderer="colorManagement: true"
    xrweb="allowedDevices: any">
    <a-assets>
      <!-- 새로 저장하신 그 모델 파일명 -->
      <a-asset-item id="faceModel" src="./assets/danjong-2ani.glb"></a-asset-item>
      <a-asset-item id="starModel" src="./assets/star-with-confetti.glb"></a-asset-item>
    </a-assets>

    <a-camera id="camera" position="0 2 4" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>
    <a-light xr-light type="ambient"></a-light>

    <!-- 컴포넌트 이름 변경 (apply-face-texture) -->
    <a-entity id="target" character-move character-recenter no-cull gltf-model="#faceModel" rotation="0 15 0"
      animation-mixer="clip: Walking; loop: repeat; crossFadeDuration: 0.4" xrextras-hold-drag="rise-height: 0"
      xrextras-two-finger-rotate xrextras-pinch-scale scale="1 1 1">
    </a-entity>

    <a-box id="ground" scale="1000 2 1000" position="0 -1 0" material="shader: shadow; transparent: true; opacity: 0.4"
      shadow></a-box>

  </a-scene>

</body>

</html>
