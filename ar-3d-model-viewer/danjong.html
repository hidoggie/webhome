<!DOCTYPE html>
<html lang="ko">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta charset="UTF-8">
  <title>Face-Capture-AR</title>

  <script src="./../xr_st/8frame-1.4.1.min.js"></script>
  <script src="./../xr_st/xrextras.js"></script>
  <script async src="./../xr_st/xr.js" data-preload-chunks="slam"></script>
  <script src="./../xr_st/coaching-overlay.js"></script>
  <script src="./../xr_st/aframe-extras-6.1.1.min.js"></script>

  <!-- 모듈 스크립트 연결 -->
  <script type="module" src="./danjong.js" defer></script>

  <link rel="stylesheet" href="./danjong.css">

</head>

<body>

  <div id="overlay" style="z-index: 2">
    <img id="recenterBtn" src="./assets/reset.svg">
    <h3>DRAG TO MOVE</h3>
  </div>

<!-- 상단 점수 UI -->
<div id="score-board" style="position: absolute; top: 20px; left: 20px; z-index: 999; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
  점수: <span id="current-score">0</span> / 100
</div>

<!-- 최종 목표 달성 팝업 UI (초기에는 숨김 처리) -->
<div id="success-popup" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
  <h2 style="margin: 0 0 10px 0; color: #333;">🎉 축하합니다! 🎉</h2>
  <p style="margin: 0 0 20px 0; color: #666; font-size: 18px;">목표 점수를 달성했습니다!</p>
  <button onclick="window.location.reload()" style="padding: 12px 24px; font-size: 16px; border-radius: 8px; background: linear-gradient(90deg,#7611b7,#c86dd7); color: white; border: none; cursor: pointer; font-weight: bold;">다시 하기</button>
</div>

    <a-scene 
      coaching-overlay
      xrextras-gesture-detector 
      landing-page 
      xrextras-loading 
      game-manager
      renderer="colorManagement: true"
      xrweb="allowedDevices: any">
      <a-assets>
        <!-- 새로 저장하신 그 모델 파일명 -->
        <a-asset-item id="faceModel" src="./assets/danjong-2ani.glb"></a-asset-item>
        <a-asset-item id="starModel" src="./assets/star-with-confetti.glb"></a-asset-item>     
      </a-assets>

      <a-camera 
        id="camera" 
        position="0 2 4"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>
      <a-light xr-light type="ambient"></a-light>

      <!-- 컴포넌트 이름 변경 (apply-face-texture) -->
      <a-entity 
        id="target" 
        character-move
        character-recenter
        no-cull
        gltf-model="#faceModel" 
        rotation="0 15 0"
        animation-mixer="clip: Walking; loop: repeat; crossFadeDuration: 0.4" 
        xrextras-hold-drag="rise-height: 0"    
        xrextras-two-finger-rotate 
        xrextras-pinch-scale
        scale="1 1 1"
      >
      </a-entity>

      <a-box
        id="ground"
        scale="1000 2 1000"
        position="0 -1 0"
        material="shader: shadow; transparent: true; opacity: 0.4"
        shadow
      ></a-box>

    </a-scene>

</body>

</html>
